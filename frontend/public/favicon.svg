<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sx-chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <linearGradient id="sx-chassis-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="sx-gold-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="40%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="sx-white-blade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <radialGradient id="sx-ambient-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FFB703" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Chassis Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#sx-chassis-grad)" stroke="url(#sx-chassis-border)" stroke-width="1.8" />
  
  <!-- Ambient Acoustic Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#sx-ambient-bloom)" />

  <!-- Left (Port) Acoustic Wavefronts -->
  <path d="M 21 21 A 15.5 15.5 0 0 0 21 43" fill="none" stroke="#FFB703" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.95" />
  <path d="M 15 16 A 23 23 0 0 0 15 48" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M 9 11 A 31 31 0 0 0 9 53" fill="none" stroke="#FFB703" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.3" stroke-dasharray="2 3" />

  <!-- Right (Starboard) Acoustic Wavefronts -->
  <path d="M 43 21 A 15.5 15.5 0 0 1 43 43" fill="none" stroke="#FFB703" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.95" />
  <path d="M 49 16 A 23 23 0 0 1 49 48" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M 55 11 A 31 31 0 0 1 55 53" fill="none" stroke="#FFB703" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.3" stroke-dasharray="2 3" />

  <!-- Primary Gold Blade -->
  <path d="M 18 14 L 26 14 L 46 50 L 38 50 Z" fill="url(#sx-gold-blade)" />

  <!-- Secondary Titanium Wings with negative space -->
  <path d="M 46 14 L 38 14 L 33 23 L 37 27 Z" fill="url(#sx-white-blade)" />
  <path d="M 27 37 L 31 41 L 26 50 L 18 50 Z" fill="url(#sx-white-blade)" />

  <!-- Hydrophone Ping Core -->
  <circle cx="32" cy="32" r="4.5" fill="#FFB703" stroke="#06090F" stroke-width="1.8" />
  <circle cx="32" cy="32" r="1.8" fill="#FFFFFF" />

  <!-- Top / Bottom Alignment Ticks -->
  <line x1="32" y1="4" x2="32" y2="7" stroke="#FFB703" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="57" x2="32" y2="60" stroke="#FFB703" stroke-width="1.5" stroke-linecap="round" />
</svg>